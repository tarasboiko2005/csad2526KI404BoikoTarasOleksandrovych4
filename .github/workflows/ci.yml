name: Cross-platform CI

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: cross_build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # --- Checkout ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Встановлення CMake ---
      - name: Ensure CMake is available (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Ensure CMake is available (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          which brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install cmake

      - name: Ensure CMake is available (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System' || echo "choco may require admin privileges"

      # --- Збірка і тести ---
      - name: Run CI script (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -S . -B build -DBUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Run CI script (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake -S . -B build -DBUILD_TESTS=ON
          cmake --build build --config Debug
          ctest --test-dir build -C Debug --output-on-failure

      # --- Перевірка наявності build папки (необов'язково, для налагодження) ---
      - name: Verify build artifacts
        run: |
          if [ -d "build" ]; then
            echo "Build directory exists."
          else
            echo "Build directory does not exist."
            exit 1
          fi

      # --- Завантаження артефактів ---
      - name: Upload build artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            build/hello
            build/HelloProject_tests
            build/lib/**/*.a

      - name: Upload build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            build/Debug/hello.exe
            build/Debug/HelloProject_tests.exe
            build/lib/Debug/**/*.lib
