name: Cross-platform CI

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: cross_build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure CMake is available
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Ensure CMake is available (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake

      - name: Ensure CMake is available (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System' || echo "choco may require admin privileges"

      - name: Make CI script executable (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          if [ -f ./ci.sh ]; then chmod +x ./ci.sh; fi

      - name: Run CI script (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          if [ -f ./ci.sh ]; then ./ci.sh; else cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure; fi

      - name: Run CI script (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path -Path .\ci.bat) { .\ci.bat } else { cmake -S . -B build; cmake --build build; ctest --test-dir build --output-on-failure }

      - name: Deploy (placeholder)
        run: echo "Deploy step placeholder - add deployment actions here"
